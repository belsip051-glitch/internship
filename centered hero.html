<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Centered Hero</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family: Arial, sans-serif;
    }

    body{
        background:#f5f5f5;
    }

    .hero{
        text-align:center;
        max-width:900px;
        margin:100px auto;
        padding:20px;
    }

    .hero h1{
        font-size:70px;
        font-weight:bold;
        color:#212529;
        margin-bottom:20px;
    }

    .hero p{
        font-size:22px;
        line-height:1.8;
        color:#555;
        margin-bottom:40px;
    }

    .buttons{
        display:flex;
        justify-content:center;
        gap:15px;
        flex-wrap:wrap;
    }

    .btn{
        padding:15px 40px;
        font-size:24px;
        border-radius:8px;
        text-decoration:none;
        transition:0.3s;
    }

    .btn-primary{
        background:#0d6efd;
        color:white;
    }

    .btn-primary:hover{
        background:#0b5ed7;
    }

    .btn-secondary{
        border:1px solid #6c757d;
        color:#6c757d;
        background:white;
    }

    .btn-secondary:hover{
        background:#e9ecef;
    }

    @media(max-width:768px){
        .hero h1{
            font-size:45px;
        }

        .hero p{
            font-size:18px;
        }

        .btn{
            font-size:18px;
            padding:12px 30px;
        }
    }
</style>
</head>
<body>

<div class="hero">
    <h1>Centered hero</h1>

    <p>
        Quickly design and customize responsive mobile-first sites with
        Bootstrap, the world's most popular front-end open source toolkit,
        featuring Sass variables and mixins, responsive grid system,
        extensive prebuilt components, and powerful JavaScript plugins.
    </p>

    <div class="buttons">
        <a href="#" class="btn btn-primary">Primary button</a>
        <a href="#" class="btn btn-secondary">Secondary</a>
    </div>
</div>

</body>
</html>
