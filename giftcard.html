<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amazon Gift Cards</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f5f5f5;
    padding:30px;
}

h1{
    text-align:center;
    font-size:48px;
    margin-bottom:40px;
}

.cards{
    display:flex;
    justify-content:center;
    gap:30px;
    flex-wrap:wrap;
}

.card{
    width:400px;
    background:#fff;
    border-radius:25px;
    overflow:hidden;
    border:1px solid #ddd;
    transition:0.3s;
}

.card:hover{
    transform:translateY(-5px);
    box-shadow:0 5px 15px rgba(0,0,0,0.15);
}

.card img{
    width:100%;
    height:330px;
    object-fit:cover;
}

.card h2{
    text-align:center;
    padding:25px;
    font-size:50px;
    font-weight:500;
}
</style>

</head>
<body>

<h1>Explore popular Amazon Pay Gift Cards</h1>

<div class="cards">

    <div class="card">
        <img src="me.jpeg" alt="Your Photo">
        <h2>Your Photo</h2>
    </div>

    <div class="card">
        <img src="bunny.jpg" alt="Animated">
        <h2>Animated</h2>
    </div>

    <div class="card">
        <img src="baby sheep.jpg" alt="Physical">
        <h2>Physical</h2>
    </div>

</div>

</body>
</html>
