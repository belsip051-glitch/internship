<!DOCTYPE html>
<html>
<head>
    <title>Water Bottle Card</title>

    <style>
        .card {
            width: 250px;
            border: 1px solid #ddd;
            padding: 15px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin: 50px auto;
        }

        .card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 8px;
        }

        .price {
            color: green;
            font-size: 22px;
            font-weight: bold;
        }

        button {
            background: #2874f0;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #0b57d0;
        }
    </style>
</head>

<body>

    <div class="card">
        <img src="bottle.jpg" alt="Water Bottle">

        <h3>Water Bottle</h3>

        <p>Premium Quality Water Bottle</p>

        <p class="price">₹118</p>

        <button>Buy Now</button>
    </div>

</body>
</html>
