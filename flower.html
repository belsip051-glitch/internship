<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card Layout</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    display:flex;
    justify-content:center;
    gap:25px;
    padding:30px;
    background:#f2f2f2;
}

.card{
    width:320px;
    height:550px;
    border-radius:25px;
    overflow:hidden;
    position:relative;
    color:white;
}

.card img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.overlay{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.25);
}

.content{
    position:absolute;
    left:25px;
    top:220px;
    z-index:2;
}

.content h2{
    font-size:52px;
    line-height:1;
    font-weight:700;
}

.footer{
    position:absolute;
    bottom:20px;
    left:20px;
    right:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    z-index:2;
    font-size:20px;
}

.logo{
    width:40px;
    height:40px;
    border-radius:50%;
    background:#8a2be2;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
}
</style>
</head>
<body>

<div class="card">
    <img src="moon.jpg" alt="">
    <div class="overlay"></div>

    <div class="content">
        <h2>Short title,<br>long jacket</h2>
    </div>

    <div class="footer">
        <div class="logo">B</div>
        <div>🌍 Earth &nbsp; 📅 3d</div>
    </div>
</div>

<div class="card">
    <img src="mariegold.jpg" alt="">
    <div class="overlay"></div>

    <div class="content">
        <h2>Much longer title that wraps to multiple lines</h2>
    </div>

    <div class="footer">
        <div class="logo">B</div>
        <div>📍 Pakistan &nbsp; 📅 4d</div>
    </div>
</div>

<div class="card">
    <img src="jellyfish.jpg" alt="">
    <div class="overlay"></div>

    <div class="content">
        <h2>Another longer title belongs here</h2>
    </div>

    <div class="footer">
        <div class="logo">B</div>
        <div>📍 California &nbsp; 📅 5d</div>
    </div>
</div>

</body>
</html>
